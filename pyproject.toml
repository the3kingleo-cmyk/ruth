[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruth-mind"
dynamic = ["version"]
description = "Ruth: a token-free, continuous-time mind that learns while she lives. No API keys, no plugins, no pretrained model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
keywords = ["continuous-time", "liquid neural network", "hopfield", "state space model",
            "active inference", "token-free", "offline", "lifelong learning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# The launcher (`ruth-launch test`, `ruth-launch doctor`) runs pytest, so the
# dev extra has to exist for a fresh install to be verifiable. Without it a
# clean machine reports "No module named pytest" and the suite never runs.
dev = ["pytest>=7.0"]

[project.scripts]
ruth = "ruth.cli:main"

[tool.setuptools.packages.find]
include = ["ruth*"]
namespaces = true

[tool.setuptools.dynamic]
version = { attr = "ruth.__version__" }

[tool.setuptools.package-data]
"ruth.csrc" = ["ruth_core.c", "Makefile"]
"ruth.app.static" = ["*.html", "*.js", "*.css", "*.svg"]
