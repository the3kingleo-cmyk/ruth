name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build numpy && python -m unittest discover -s tests -t .
      - run: python -m build --outdir dist .
      - name: Download bundle (installer + source, no personal files)
        run: |
          name=ruth-${GITHUB_REF_NAME}
          mkdir -p "$name"
          cp -r ruth tests docs README.md LICENSE pyproject.toml install.sh install.ps1 "$name"/
          rm -rf "$name"/ruth/csrc/ruth-core
          zip -qr "dist/$name.zip" "$name"
          tar czf "dist/$name.tar.gz" "$name"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Ruth $GITHUB_REF_NAME" --generate-notes
